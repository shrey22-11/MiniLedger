services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger
      POSTGRES_DB: miniledger
    ports:
      - '5432:5432'
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miniledger']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ledger_data:
